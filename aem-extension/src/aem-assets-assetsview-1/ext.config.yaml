operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
hooks:
  post-app-deploy: ./hooks/post-deploy.js
runtimeManifest:
  packages:
    aem-assets-assetsview-1:
      license: Apache-2.0
      actions:
        guided-upload-api:
          function: actions/guided-upload-api/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: info
            AEM_AUTHOR_URL: $AEM_AUTHOR_URL
            AEM_MULTI_TENANT: $AEM_MULTI_TENANT
          limits:
            timeout: 120000
            memorySize: 256
          annotations:
            require-adobe-auth: true
            final: true
